name: Extract Nabz Football project

on:
  workflow_dispatch:

permissions:
  contents: write
  workflows: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.ref }}

      - name: Show workspace (debug)
        run: |
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "Listing repo root:"
          ls -la

      - name: Extract project ZIP
        shell: bash
        run: |
          set -xeuo pipefail

          ZIP_FILE="NabzFootball-Android-Project.zip"

          echo "Checking ZIP file..."
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found!"
            echo "Files in repository:"
            find . -maxdepth 3 -type f | sort
            # اگر ZIP در ریپو نیست ممکن است لازم باشد آن را دانلود کنید یا از release/artifact بگیرید
            exit 1
          fi

          echo "ZIP found:"
          ls -lh "$ZIP_FILE"

          rm -rf /tmp/nabz-project
          mkdir -p /tmp/nabz-project

          echo "Extracting ZIP..."
          unzip -q "$ZIP_FILE" -d /tmp/nabz-project

          echo "Extracted files (top):"
          find /tmp/nabz-project -maxdepth 4 -type f | sort

          PROJECT_DIR=$(find /tmp/nabz-project -type d -name "NabzFootball" -print -quit || true)

          if [ -n "$PROJECT_DIR" ]; then
            echo "Project found at: $PROJECT_DIR"
            cp -a "$PROJECT_DIR"/. .
          else
            echo "NabzFootball folder not found inside ZIP."
            echo "Copying extracted files directly..."
            cp -a /tmp/nabz-project/. .
          fi

          rm -f "$ZIP_FILE"

          echo "Final project structure (top):"
          find . -maxdepth 3 -type f | sort

      - name: Commit extracted project
        shell: bash
        run: |
          set -xeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract Nabz Football Android project"

          # compute branch name from GITHUB_REF (refs/heads/<branch>)
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Pushing to branch: $BRANCH"
          git push origin "HEAD:$BRANCH"
