name: Extract Nabz Football project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check ZIP file
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "NabzFootball.zip" ]; then
            echo "ERROR: NabzFootball.zip not found in repository root."
            echo "Files in repository:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          echo "ZIP file found:"
          ls -lh NabzFootball.zip

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/nabz-project
          mkdir -p /tmp/nabz-project

          unzip -q NabzFootball.zip -d /tmp/nabz-project

          echo "Extracted files:"
          find /tmp/nabz-project -maxdepth 3 -type f | sort

          if [ -d "/tmp/nabz-project/NabzFootball" ]; then
            echo "NabzFootball folder found."

            cp -a /tmp/nabz-project/NabzFootball/. .

          else
            echo "NabzFootball folder not found."
            echo "Checking extracted structure..."

            FIRST_DIR=$(find /tmp/nabz-project -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)

            if [ -n "$FIRST_DIR" ]; then
              echo "Using extracted folder: $FIRST_DIR"
              cp -a "$FIRST_DIR"/. .
            else
              echo "ZIP contains files directly."
              cp -a /tmp/nabz-project/. .
            fi
          fi

          rm -f NabzFootball.zip

          echo "Project files in repository:"
          find . -maxdepth 2 -type f | sort | head -200

      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract Nabz Football Android project"
          git push
