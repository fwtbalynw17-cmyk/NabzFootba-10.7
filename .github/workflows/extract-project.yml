name: Extract Nabz Football project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="NabzFootball-Android-Project.zip"

          echo "Checking ZIP file..."

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found!"
            echo "Files in repository:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          echo "ZIP found:"
          ls -lh "$ZIP_FILE"

          rm -rf /tmp/nabz-project
          mkdir -p /tmp/nabz-project

          echo "Extracting ZIP..."
          unzip -q "$ZIP_FILE" -d /tmp/nabz-project

          echo "Extracted files:"
          find /tmp/nabz-project -maxdepth 4 -type f | sort

          PROJECT_DIR=$(find /tmp/nabz-project -type d -name "NabzFootball" -print -quit || true)

          if [ -n "$PROJECT_DIR" ]; then
            echo "Project found at: $PROJECT_DIR"
            cp -a "$PROJECT_DIR"/. .
          else
            echo "NabzFootball folder not found."
            echo "Copying extracted files directly..."
            cp -a /tmp/nabz-project/. .
          fi

          rm -f "$ZIP_FILE"

          echo "Final project structure:"
          find . -maxdepth 3 -type f | sort

      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract Nabz Football Android project"
            git push
          fi
